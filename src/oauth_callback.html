<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authentication Completed</title>
    <style>
      /*
       * We use a soft light theme without dark-mode switching, 
       * keeping everything local and framework-free.
       */
      :root {
        --bg: #f6f8fb;
        --card-bg: rgba(255, 255, 255, 0.65);
        --border: rgba(15, 23, 42, 0.06);
        --text: #0f172a; /* slate-900 */
        --muted: #475569; /* slate-600 */
        --accent: #10b981; /* emerald-500 */
        --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      }

      html, body { height: 100%; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 20% -10%, #e6f7ff 0%, transparent 60%),
          radial-gradient(900px 500px at 90% 0%, #ffe6f2 0%, transparent 55%),
          linear-gradient(180deg, var(--bg), #eef2f7);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 28px 28px 24px;
        text-align: center;
        animation: fade-in 400ms ease-out both;
      }

      .icon-wrap {
        height: 72px;
        width: 72px;
        border-radius: 999px;
        margin: -8px auto 14px;
        display: grid;
        place-items: center;
        background: conic-gradient(from 180deg at 50% 50%, #34d399, #10b981, #059669);
        box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
      }

      .icon {
        height: 44px; width: 44px;
        background: white;
        border-radius: 999px;
        display: grid; place-items: center;
      }

      svg {
        display: block;
        height: 26px; width: 26px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 6px 0 8px;
      }

      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .hint {
        margin: 14px 0 0;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.9;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(2px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Respect reduced motion preferences for accessibility. */
      @media (prefers-reduced-motion: reduce) {
        .card { animation: none; }
        .draw { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="title">
      <!-- Icon with a subtle animated checkmark -->
      <div class="icon-wrap" aria-hidden="true">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- This path animates the checkmark stroke to draw-in nicely -->
            <path class="draw" d="M5 13l4 4L19 7" style="stroke-dasharray: 24; stroke-dashoffset: 24; animation: dash 900ms cubic-bezier(.22,1,.36,1) 120ms forwards;"/>
            <style>
              @keyframes dash { to { stroke-dashoffset: 0; } }
            </style>
          </svg>
        </div>
      </div>

      <!-- Clear headline and friendly description -->
      <h1 id="title" class="title">Sign‑in completed</h1>
      <p class="desc">You may safely close this window.</p>
      <p class="hint">This tab will not close itself for security reasons.</p>
    </main>
  </body>
</html>
